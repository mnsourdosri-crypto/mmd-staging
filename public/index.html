<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMD</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #151515;
      border: 1px solid #2b2b2b;
      border-radius: 24px;
      padding: 30px 22px;
      text-align: center;
    }

    h1 {
      font-size: 46px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 28px;
    }

    .status {
      background: #202020;
      border-radius: 14px;
      padding: 15px;
      margin: 12px 0;
      line-height: 1.7;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: white;
      color: black;
    }

    .secondary {
      background: #2b2b2b;
      color: white;
    }

    #result {
      margin-top: 18px;
      color: #ccc;
      min-height: 24px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>MMD</h1>
    <div class="subtitle">MMD Staging</div>

    <div class="status" id="serverStatus">
      جاري فحص السيرفر...
    </div>

    <button class="primary" onclick="checkServer()">
      فحص السيرفر
    </button>

    <button class="secondary" onclick="testPayment()">
      اختبار API الدفع
    </button>

 <div style="margin-top:18px;">
  <button class="primary" onclick="startPayment('Apple Pay')">
     Apple Pay
  </button>

  <button class="secondary" onclick="startPayment('Tabby')">
    تابي
  </button>

  <button class="secondary" onclick="startPayment('Tamara')">
    تمارا
  </button>
</div>   <div id="result"></div>
  </div>

  <script>
    async function checkServer() {
      const status = document.getElementById("serverStatus");
      const result = document.getElementById("result");

      status.textContent = "جاري الفحص...";
      result.textContent = "";

      try {
        const response = await fetch("/health");
        const data = await response.json();

        if (response.ok) {
          status.textContent = "✅ السيرفر يعمل";
          result.textContent =
            data.message || data.status || "MMD server is running";
        } else {
          status.textContent = "⚠️ السيرفر رد بخطأ";
        }
      } catch (error) {
        status.textContent = "❌ تعذر الاتصال بالسيرفر";
        result.textContent = error.message;
      }
    }

    async function testPayment() {
      const result = document.getElementById("result");

      result.textContent = "جاري اختبار API...";

      try {
        const response = await fetch("/api/payment", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            test: true
          })
        });

        const data = await response.json();

        result.textContent =
          data.message || "HTTP Status: " + response.status;
      } catch (error) {
        result.textContent = "خطأ: " + error.message;
      }
    }

    checkServer(); function startPayment(method) {
  alert("طريقة الدفع المختارة: " + method);
}
  </script>

</body>
</html>
